name: DCO

on:
  workflow_call:
    inputs:
      base_sha: { required: true, type: string }
      head_sha: { required: true, type: string }

permissions:
  contents: read
  pull-requests: read

jobs:
  DCO:
    # Queue admission requires DCO on each PR; GitHub-generated merge commits are exempt.
    # Keep this job visible as skipped on merge_group for the required check context.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: KineticCafe/actions-dco@5f160e3ee086af8fc0fb567b8add0937d074123e # v3.2.0
        with:
          config: |
            bot.policy = "none"
