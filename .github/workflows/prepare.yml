name: Isolated preparation
on:
  workflow_call:
    inputs:
      expected_sha: { required: true, type: string }
      policy_revision: { required: true, type: string }
      batch_id: { required: true, type: string }
      package: { required: true, type: string }
      profile: { required: true, type: string }
      versions: { required: true, type: string }
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ryro-hq/ryro-bot
          ref: ${{ inputs.policy_revision }}
          path: .ryro-bot
          persist-credentials: false
      - uses: ./.github/actions/core
      - name: Prepare bounded changes without write credentials
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          POLICY_REVISION: ${{ inputs.policy_revision }}
          BATCH_ID: ${{ inputs.batch_id }}
          PACKAGE: ${{ inputs.package }}
          PROFILE: ${{ inputs.profile }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          python3 .ryro-bot/scripts/prepare.py "$PWD" "$RUNNER_TEMP/prepared.json" \
            "$PWD/.core/target/catalog-candidate/srx"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: prepared-${{ inputs.batch_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared.json
          if-no-files-found: error
          retention-days: 7
