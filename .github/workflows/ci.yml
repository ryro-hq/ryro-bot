name: Bot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  DCO:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dco.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: ryro_bot_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/ryro_bot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm audit --omit=dev
